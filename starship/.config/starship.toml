add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$fill\
$nodejs\
$time\
$line_break\
$character"""

[username]
format = "[$user]($style)"
style_user = "bold #C792EA"
show_always = true

[hostname]
format = "[@$hostname]($style) "
style = "bold #C792EA"
ssh_only = false

[directory]
format = "[$path]($style) "
style = "bold #57C7FF"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"

[git_branch]
format = "[$branch]($style) "
style = "bold bright-black"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "yellow"
conflicted = "=$count"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?$count"
stashed = "\u0024$count"
modified = "!$count"
staged = "+$count"
renamed = "»$count"
deleted = "×$count"

[cmd_duration]
format = "[$duration]($style) "
style = "dimmed white"
min_time = 2000

[fill]
symbol = " "

[nodejs]
format = "[$version]($style)  "
style = "bold #68A063"
version_format = "${major}.${minor}.${patch}"
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[time]
disabled = false
format = "[$time]($style)"
style = "dimmed white"
time_format = "%H:%M:%S"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
